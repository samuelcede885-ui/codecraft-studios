  --page: #E9EDF3;
  --on: #FFFFFF;

  --blue-light: #60A5FA;
  --track: #E5E7EB;
  --line2: #CBD5E1;
  --body: #334155;
  --note-ink: #1E40AF;
  --dark-muted: #9CA3AF;

* { box-sizing: border-box; margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body {

  color: var(--ink);
  background: var(--page);

button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; text-align: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {

svg { width: 22px; height: 22px; flex: none; }

/* Contenedor tipo teléfono */
.phone {

  max-width: 430px;
  min-height: 100dvh;
  margin: 0 auto;
  background: var(--white);
  overflow: hidden;
}
.screen {

}

.display { font-size: 44px; line-height: .98; font-weight: 800; letter-spacing: -.04em; }
.title { font-size: 38px; line-height: 1.05; font-weight: 800; letter-spacing: -.035em; }
.h2 { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
.sub { color: var(--muted); font-size: 14px; }
.label { font-size: 15px; font-weight: 600; margin-top: 6px; }
.tag { color: var(--blue); font-size: 12px; font-weight: 700; }
.tag.light { color: var(--blue-light); }
.meta { color: var(--muted); font-size: 12px; }
.big { font-size: 30px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }

/* Avatar */
.avatar {

.row { display: flex; align-items: center; gap: 12px; }
.between { justify-content: space-between; }
.top { align-items: flex-start; }

/* Tarjetas */
.card { background: var(--gray); border-radius: var(--r-md); padding: 18px; }
.card.dark { background: var(--dark); color: var(--on); border-radius: var(--r-lg); }
.card.dark .meta, .card.dark .sub { color: var(--dark-muted); }
.card.outline { background: var(--white); border: 1px solid var(--line); }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat { display: flex; flex-direction: column; gap: 8px; min-height: 92px; justify-content: center; }
.stat .big { display: flex; align-items: center; gap: 6px; }
.stat .big svg { color: var(--blue); width: 24px; height: 24px; }

.route { display: flex; flex-direction: column; gap: 10px; list-style: none; padding: 0; }
.route li { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--dark-text2); }
.route li::before {

.route li.done { color: var(--on); }
.route li.done::before { background: var(--blue); border-color: var(--blue); }

.bar { height: 6px; border-radius: 99px; background: var(--track); overflow: hidden; }
.card.dark .bar { background: var(--dark-line); }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--blue); transition: width .5s ease; }

/* Botones */
.btn {

}
.btn.white { background: var(--on); color: var(--on-ink); }
.btn.black { background: var(--dark); color: var(--on); }
.btn.blue { background: var(--blue); color: var(--on); }
.btn.ghost { background: var(--gray); color: var(--ink); }
.btn.block { width: 100%; }
.btn:active, .banner:active, button.card:active { transform: scale(.98); }

.banner {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  width: 100%; padding: 18px 18px 18px 20px;

.banner strong { display: block; font-size: 19px; font-weight: 700; letter-spacing: -.02em; }
.banner span { font-size: 13px; opacity: .9; }
.circle {
  display: grid; place-items: center; flex: none;
  width: 42px; height: 42px; border-radius: 50%; background: var(--dark); color: var(--on);
}

.pills { display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px; padding: 2px 20px; scrollbar-width: none; }
.pills::-webkit-scrollbar { display: none; }
.pill {
  flex: none; min-height: 40px; padding: 0 18px; border-radius: 99px;
  background: var(--gray); font-size: 13px; font-weight: 600;

}
.pill svg { width: 16px; height: 16px; }
.pill.on { background: var(--dark); color: var(--on); }
.pill.blue { background: var(--blue); color: var(--on); }

.task { display: flex; flex-direction: column; gap: 10px; }
.task h3 { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
.task .state { color: var(--muted); font-weight: 500; }
.task .state.ok { color: var(--ok); }
.task .pct { font-size: 15px; font-weight: 700; white-space: nowrap; }
.link { color: var(--ink); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 2px; padding: 6px 0; }
.link svg { width: 16px; height: 16px; }
.urgent { color: var(--bad); font-weight: 600; }
.empty { text-align: center; padding: 36px 16px; color: var(--muted); font-size: 14px; }

/* Perfil */
.metrics { padding: 22px; display: flex; flex-direction: column; gap: 18px; }
.cols { display: grid; grid-template-columns: repeat(3, 1fr); }
.cols > div { padding-left: 14px; border-left: 1px solid var(--dark-line); display: flex; flex-direction: column; gap: 6px; }
.cols > div:first-child { padding-left: 0; border: 0; }
.cols .big.blue { color: var(--blue-light); }
.setting { display: flex; align-items: center; gap: 14px; width: 100%; padding: 16px; border: 1px solid var(--line); border-radius: var(--r-md); }
.setting > div { flex: 1; min-width: 0; }
.setting b { display: block; font-size: 14px; font-weight: 600; }
.setting .chev { color: var(--muted); width: 18px; height: 18px; }

.nav {
  position: fixed; z-index: 10;
  left: 50%; transform: translateX(-50%);
  bottom: calc(12px + env(safe-area-inset-bottom));
  width: min(calc(100% - 28px), 402px); height: var(--nav-h);
  display: grid; grid-template-columns: repeat(5, 1fr); align-items: center;
  background: var(--white); border: 1px solid var(--line); border-radius: 26px;
  box-shadow: 0 10px 30px rgba(15, 23, 42, .08);

.sheet.open { visibility: visible; }
.sheet .backdrop { position: absolute; inset: 0; background: rgba(15, 23, 42, .45); opacity: 0; transition: opacity .25s; }
.sheet.open .backdrop { opacity: 1; }
.sheet .panel {

.steps li.active i { border-color: var(--blue); border-top-color: transparent; animation: spin .8s linear infinite; }
.steps li.done { color: var(--ink); }
.steps li.done i { background: var(--blue); border-color: var(--blue); }
.steps li.done i::after { content: ""; width: 8px; height: 4px; border: solid var(--on); border-width: 0 0 2px 2px; transform: rotate(-45deg) translateY(-1px); }
@keyframes spin { to { transform: rotate(360deg); } }
.note { background: var(--blue-soft); color: var(--note-ink) !important; border-radius: 14px; padding: 12px 14px; font-size: 13px !important; }
.draft h4 { font-size: 14px; font-weight: 700; margin: 10px 0 2px; }
.quiz { display: flex; flex-direction: column; gap: 8px; }
.opt { width: 100%; padding: 12px 14px; border-radius: 14px; background: var(--gray); font-size: 14px; }
.opt.right { background: var(--ok-bg); color: var(--ok-ink); font-weight: 600; }

.field input, .field select, .field textarea {

.toast {

  background: var(--dark); color: var(--on); font-size: 13px; font-weight: 500;

  transition: opacity .25s, transform .25s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.lock { min-height: calc(100dvh - 80px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; }
.dots { display: flex; gap: 14px; margin: 8px 0 0; }

.dots i.on { background: var(--blue); border-color: var(--blue); }
.lock-msg { min-height: 20px; color: var(--bad); font-size: 13px; font-weight: 600; }
.pad { display: grid; grid-template-columns: repeat(3, 72px); gap: 14px; }
.key { width: 72px; height: 72px; border-radius: 50%; background: var(--gray); font-size: 26px; font-weight: 600; display: grid; place-items: center; text-align: center; }
.key:active { background: var(--blue); color: var(--on); }

.phone.locked .nav { display: none; }

.sheet ol li { font-size: 14px; line-height: 1.55; color: var(--body); }
.note.warn { background: var(--bad-bg); color: var(--bad-ink) !important; }
.prompt { width: 100%; font: 13px/1.5 ui-monospace, "SF Mono", Menlo, monospace; color: var(--ink); background: var(--gray); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; resize: vertical; }
.checklist { display: flex; flex-direction: column; gap: 8px; }
.check { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 14px; background: var(--gray); font-size: 14px; line-height: 1.4; cursor: pointer; }
.check input { width: 20px; height: 20px; margin: 0; accent-color: var(--blue); flex: none; }
.sheet .panel > * { flex-shrink: 0; }
.prompt { min-height: 180px; }

.chip { flex: none; padding: 5px 12px; border-radius: 99px; font-size: 12px; font-weight: 700; white-space: nowrap; background: var(--gray); }

.chip.ok { background: var(--ok-bg); color: var(--ok-ink); }
.chip.bad { background: var(--bad-bg); color: var(--bad-ink); }

/* Asistente de agenda */
.answer { display: flex; flex-direction: column; gap: 12px; margin-top: 4px; }
.answer h2 { text-wrap: balance; }

</style>

const { renderExams } = __m["src/screens/exams.js"];
const { renderProfile } = __m["src/screens/profile.js"];
const { renderAgent } = __m["src/screens/agent.js"];
const { renderAgenda } = __m["src/screens/agenda.js"];
const { answer: agendaAnswer, answerText: agendaAnswerText } = __m["src/services/agenda.js"];
const { renderAnswer: renderAgendaAnswer } = __m["src/screens/agenda.js"];
const agent = __m["src/services/agent.js"];
const { buildPlan } = __m["src/services/estudiante-pro.js"];
const { solvingSheet, draftSheet, guideSheet, newTaskSheet, principlesSheet, syncSheet } = __m["src/screens/sheets.js"];
const { renderLock, pinSheet, wipeSheet, tipsSheet } = __m["src/screens/lock.js"];
const guard = __m["src/services/lock.js"];

// Estado de navegación (no se persiste)
const view = { screen: 'home', filter: 'todas', subjectId: null, agendaQ: 'semana', agendaText: '' };
let solveRun = 0; // invalida una resolución en curso si se cierra la hoja

const SCREENS = {
  home: renderHome,
  tasks: () => renderTasks(view),
  subjects: renderSubjects,
  exams: renderExams,
  profile: renderProfile,
  agent: renderAgent,
  agenda: () => renderAgenda(view.agendaQ || 'semana', view.agendaText || ''),
};

let pinEntry = '';
let pinMsg = '';

function render() {
  const phone = document.querySelector('.phone');
  if (guard.isLocked()) {
    phone.classList.add('locked');
    document.getElementById('screen').innerHTML = renderLock(pinEntry, pinMsg);
    document.getElementById('nav').innerHTML = '';
    return;
  }
  phone.classList.remove('locked');
  document.getElementById('screen').innerHTML = SCREENS[view.screen]();
  document.getElementById('nav').innerHTML = renderNav(view.screen);
}

function lockNow() {
  if (!guard.hasPin() || guard.isLocked()) return;
  guard.lock();
  solveRun++;
  closeSheet();
  pinEntry = '';
  pinMsg = '';
  render();
}

async function tryUnlock() {
  if (pinEntry.length < 4) { pinMsg = 'El PIN tiene al menos 4 números'; return render(); }
  const r = await guard.unlock(pinEntry);
  pinEntry = '';
  pinMsg = r.ok ? '' : r.wait ? `Demasiados intentos. Espera ${r.wait} s` : 'PIN incorrecto';
  render();
  if (r.ok) { toast('Desbloqueada'); runAgentOnce(); }
}

function go(screen, patch = {}) {
  Object.assign(view, { screen }, patch);
  render();
  window.scrollTo(0, 0);
}

const actions = {
  'pin-key'({ k }) {
    if (k === 'del') pinEntry = pinEntry.slice(0, -1);
    else if (pinEntry.length < 8) pinEntry += k;
    pinMsg = '';
    render();
    if (pinEntry.length >= 4 && guard.waitSeconds() === 0 && pinEntry.length === 8) tryUnlock();
  },
  'pin-ok': () => tryUnlock(),
  'forgot-pin': () => { pinMsg = 'Para recuperarla, borra los datos de este dispositivo'; openSheet(wipeSheet()); },
  'pin-setup': () => openSheet(pinSheet()),
  'toggle-autolock': () => { guard.setAutoLock(!guard.autoLockOn()); render(); },
  wipe: () => openSheet(wipeSheet()),
  'wipe-confirm': () => {
    reset();
    guard.wipeDevice();
    pinEntry = ''; pinMsg = '';
    closeSheet();
    go('home');
    toast('Datos de este dispositivo borrados');
  },
  'security-tips': () => openSheet(tipsSheet()),

  'go-agenda': () => go('agenda', { agendaQ: 'semana', agendaText: '' }),
  setAgendaAnswer(res) { const el = document.getElementById('agenda-answer'); if (el) el.innerHTML = renderAgendaAnswer(res); },
  'agenda-q'({ q }, el) {
    view.agendaQ = q; view.agendaText = '';
    const inp = document.getElementById('agenda-input'); if (inp) inp.value = '';
    document.querySelectorAll('#screen .pills .pill').forEach((b) => b.classList.toggle('on', b.dataset.q === q));
    actions.setAgendaAnswer({ ...agendaAnswer(q), id: q });
  },
  'agenda-all'({ q }) { actions.setAgendaAnswer({ ...agendaAnswer(q, { all: true }), id: q }); },
  'agenda-ask'() {
    const text = (document.getElementById('agenda-input')?.value || '').trim();
    if (!text) return;
    view.agendaText = text;
    document.querySelectorAll('#screen .pills .pill').forEach((b) => b.classList.remove('on'));
    actions.setAgendaAnswer({ ...agendaAnswerText(text), query: text });
  },
  'agenda-ask-all'() {
    const text = view.agendaText || '';
    actions.setAgendaAnswer({ ...agendaAnswerText(text, { all: true }), query: text });
  },
  'agenda-fill'({ q }) { const inp = document.getElementById('agenda-input'); if (inp) { inp.value = q; } view.agendaText = q; actions.setAgendaAnswer({ ...agendaAnswerText(q), query: q }); },
  'go-agent': () => go('agent'),
  'agent-run'() {
    const r = agent.runDaily({ force: true });
    render();
    notifyDrafts(r.prepared);
    toast(r.prepared.length ? `${r.prepared.length} borrador(es) preparado(s)` : 'No hay tareas nuevas que preparar');
  },
  'agent-review'({ id }) { agent.markReviewed(id); render(); toast('Marcado como revisado'); },
  'agent-view'({ id }) {
    const task = taskById(id);
    if (!task) return;
    openSheet(draftSheet(task, buildPlan(task)));
  },
  async 'agent-notifs'() {
    try {
      if (!globalThis.Notification) return toast('Este navegador no permite avisos');
      const perm = await Notification.requestPermission();
      toast(perm === 'granted' ? 'Avisos activados en este dispositivo' : 'Avisos no activados');
    } catch { toast('No se pudieron activar los avisos aquí'); }
  },

  go: ({ screen }) => go(screen),
  'go-pending': () => go('tasks', { filter: 'pendientes', subjectId: null }),
  'go-all': () => go('tasks', { filter: 'todas', subjectId: null }),
  'open-subject': ({ subject }) => go('tasks', { filter: 'todas', subjectId: subject }),
  'clear-subject': () => go('tasks', { subjectId: null }),
  filter: ({ filter }) => { view.filter = filter; render(); },

  'close-sheet': () => { solveRun++; closeSheet(); },

  async solve({ id }) {
    const task = taskById(id);
    const run = ++solveRun;
    openSheet(solvingSheet(task, 0));
    const draft = await solveTask(task, (step) => {
      if (run === solveRun && step < 4) setSheet(solvingSheet(task, step));
    });
    if (run !== solveRun || !sheetIsOpen()) return;
    setSheet(draftSheet(task, draft));
  },

  approve({ id }) {
    taskById(id).status = 'resuelta';
    save();
    closeSheet();
    render();
    toast('Tarea lista · guía de estudio generada');
  },

  guide: ({ subject }) => openSheet(guideSheet(buildGuide(subject))),

  review({ subject }) {
    if (state.prep != null) { state.prep = Math.min(100, state.prep + 5); save(); render(); }
    openSheet(guideSheet(buildGuide(subject)));
  },

  answer(_, el) {
    const quiz = el.closest('.quiz');
    if (quiz.dataset.done) return;
    quiz.dataset.done = '1';
    const ok = el.dataset.ok === 'true';
    el.classList.add(ok ? 'right' : 'wrong');
    if (!ok) quiz.querySelector('[data-ok="true"]').classList.add('right');
  },

  'new-task': () => openSheet(newTaskSheet()),

  sync: () => openSheet(syncSheet()),
  prefs: () => openSheet(principlesSheet()),
  check({ id, i }, el) {
    state.checks = state.checks || {};
    const list = state.checks[id] || [];
    list[Number(i)] = el.checked;
    state.checks[id] = list;
    save();
    const h = [...document.querySelectorAll('#sheet h3')].find((x) => x.textContent.startsWith('Revisión de calidad'));
    if (h) h.textContent = `Revisión de calidad · ${list.filter(Boolean).length}/7`;
  },
  'copy-prompt'() {
    const box = document.getElementById('pro-prompt');
    const fallback = () => { box.focus(); box.select(); toast('Selecciona y copia el texto'); };
    try {
      navigator.clipboard.writeText(box.value).then(() => toast('Petición copiada · pégala en Claude'), fallback);
    } catch { fallback(); }
  },
  'toggle-exam': () => {
    state.examMode = !state.examMode; save(); render();
    toast(state.examMode ? 'Modo Examen activado' : 'Modo Examen desactivado');
  },
  'toggle-notif': () => { state.notifications = !state.notifications; save(); render(); },
  reset: () => { reset(); render(); toast('Datos restaurados'); },
};

const LOCKED_OK = new Set(['pin-key', 'pin-ok', 'forgot-pin', 'wipe-confirm', 'close-sheet']);

document.addEventListener('click', (e) => {
  guard.touch();
  const el = e.target.closest('[data-action]');
  if (el && guard.isLocked() && !LOCKED_OK.has(el.dataset.action)) return;
  if (el) actions[el.dataset.action]?.(el.dataset, el);
});

document.addEventListener('submit', async (e) => {
  if (e.target.id === 'agenda-form') { e.preventDefault(); actions['agenda-ask'](); return; }
  if (e.target.id === 'import-form') {
    e.preventDefault();
    const err = document.getElementById('import-error');
    try {
      const msg = await importFile(document.getElementById('import-file').files[0]);
      closeSheet();
      render();
      toast(msg);
    } catch (error) {
      err.textContent = error.message;
    }
    return;
  }
  if (e.target.id === 'pin-form' || e.target.id === 'pin-remove-form') {
    e.preventDefault();
    const val = (id) => document.getElementById(id)?.value.trim() || '';
    const error = (msg) => { document.getElementById('pin-error').textContent = msg; };
    const current = val('pin-current');
    if (guard.hasPin()) {
      if (guard.waitSeconds()) return error(`Demasiados intentos. Espera ${guard.waitSeconds()} s`);
      if (e.target.id === 'pin-remove-form') {
        const r = await guard.removePin(current);
        if (!r.ok) return error(r.wait ? `Demasiados intentos. Espera ${r.wait} s` : 'El PIN actual no es correcto');
        closeSheet(); render(); return toast('PIN quitado');
      }
      const r = await guard.unlock(current);
      if (!r.ok) return error(r.wait ? `Demasiados intentos. Espera ${r.wait} s` : 'El PIN actual no es correcto');
    }
    const pin = val('pin-new');
    if (!guard.validPin(pin)) return error('Usa de 4 a 8 números');
    if (/^(\d)\1+$/.test(pin) || '0123456789012345678'.includes(pin) || '9876543210987654321'.includes(pin)) return error('Evita PIN fáciles como 1111 o 1234');
    if (pin !== val('pin-repeat')) return error('Los dos PIN no coinciden');
    try { await guard.setPin(pin); } catch (err) { return error(err.message); }
    closeSheet(); render(); toast('PIN activado');
    return;
  }
  if (e.target.id !== 'new-task-form') return;
  e.preventDefault();
  const form = new FormData(e.target);
  const title = String(form.get('title')).trim();
  if (!title) return;
  state.tasks.push({
    id: `t${Date.now()}`,
    subjectId: form.get('subjectId'),
    title,
    dueIn: Math.max(0, Number(form.get('dueIn')) || 0),
    status: 'pendiente',
    forExam: false,
    instructions: String(form.get('instructions')).trim() || 'Sin instrucciones adicionales.',
    weight: null,
    kind: 'manual',
  });
  save();
  closeSheet();
  go('tasks', { filter: 'pendientes', subjectId: null });
  toast('Tarea añadida');
});

// Bloqueo automático: al salir de la app y tras 2 minutos sin uso.
document.addEventListener('visibilitychange', () => {
  if (document.hidden && guard.autoLockOn()) lockNow();
});
setInterval(() => { if (guard.idleTooLong()) lockNow(); }, 15000);

// Avisos del navegador (solo si el estudiante los activa; no funcionan con la app cerrada).
function notifyDrafts(prepared) {
  if (!prepared.length) return;
  const msg = prepared.length === 1
    ? `Nueva tarea preparada: ${prepared[0].subject} — ${prepared[0].title}. Revísala y cópiala.`
    : `${prepared.length} tareas preparadas para revisar en el Agente diario.`;
  toast(msg);
  try {
    if (globalThis.Notification && Notification.permission === 'granted') {
      new Notification('Quanta AI · Agente diario', { body: msg });
    }
  } catch { /* el entorno no permite notificaciones */ }
}

// Preparación diaria: una vez por día local, al abrir la app y estar desbloqueada.
function runAgentOnce() {
  if (guard.isLocked()) return;
  const r = agent.runDaily();
  if (r.ran && r.prepared.length) { notifyDrafts(r.prepared); if (view.screen === 'home' || view.screen === 'agent') render(); }
}

document.addEventListener('keydown', (e) => {
  guard.touch();
  if (guard.isLocked() && /^\d$/.test(e.key)) return actions['pin-key']({ k: e.key });
  if (guard.isLocked() && e.key === 'Backspace') return actions['pin-key']({ k: 'del' });
  if (guard.isLocked() && e.key === 'Enter') return tryUnlock();
  if (e.key === 'Escape' && sheetIsOpen()) actions['close-sheet']();
});

render();
runAgentOnce();

return {  };
})();
})();
</script>
